name: Build release ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag für das Release (z. B. v1.1.1)'
        required: true
        default: 'v1.1.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP
        run: |
          rsync -a --exclude '.git' --exclude '.github' ./ modern-book-reviews/
          zip -r modern-book-reviews.zip modern-book-reviews

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: modern-book-reviews.zip
